# Simple vertical well used for the validation demo.
# Reference values in data/validation_reference.csv are HAND CALCULATIONS
# (Applied Drilling Engineering field formulas) - synthetic, not field data.
name: Validation demo - vertical well (synthetic)

well:
  survey:                      # [md_m, tvd_m, inclination_deg, azimuth_deg]
    - [0, 0, 0, 0]
    - [3048, 3048, 0, 0]
  hole_sections:
    - {name: Open hole 8-1/2 in, top_m: 0, bottom_m: 3048, diameter_in: 8.5}
  drill_string:
    - {name: Drill pipe 5 in, type: drill_pipe, length_m: 2895.6, od_in: 5.0, id_in: 4.276}
    - {name: Drill collars 6-1/2 in, type: bha, length_m: 152.4, od_in: 6.5, id_in: 2.8125}
  bit:
    nozzles_32nd: [12, 12, 12]
    discharge_coefficient: 0.95

mud: {density_ppg: 10.0, pv_cp: 20.0, yp_lbf100ft2: 15.0, gel_10min_lbf100ft2: 10.0}

operation:
  pump_rate_gpm: 350
  back_pressure_from: fixed
  back_pressure_psi: 100
  choke_opening: 0.5
  bp_pump_gpm: 0
  pipe_velocity_m_s: 0.0
  clinging_constant: 0.45

pressure_window: {pore_ppg: 9.5, fracture_ppg: 12.5, target_ppg: 10.5, warning_margin_psi: 100}
choke: {cv_max: 100.0, cv_closed: 1.0, min_opening: 0.02, max_opening: 1.0, max_speed_per_s: 0.05}
dynamics: {model: lumped, actuator: choke, time_step_s: 0.1, bulk_modulus_pa: 1.5e9,
           bp_time_constant_s: 2.0, bp_max_psi: 1500, profile_every_s: 10}
pid: {kp: 0.1, ki: 0.05, kd: 0.0, bp_kp: 0.6, bp_ki: 0.3, derivative_filter_s: 1.0,
      settling_band_psi: 15}
numerics: {segment_length_m: 30, low_flow_gpm: 50}
